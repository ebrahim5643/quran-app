/* ===== Hafezi style page ===== */
#view.paper{background:#fff;color:#000}
.hf{padding:6px 8px 2px;--L:40px}
.hf-top{display:flex;justify-content:space-between;align-items:center;height:34px;font-size:17px;padding:0 4px;direction:ltr;color:#000}
.hf-top .big{font-size:26px;font-family:Roboto,sans-serif;font-weight:400}
.hf-top b{font-size:15px;font-weight:600;color:#444;font-family:Roboto,sans-serif}
.hf-foot{height:24px;line-height:24px;text-align:center;font-size:17px;color:#000;margin-top:2px}
.hf-frame{padding:13px;background:#fff url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2713%27%20height%3D%2713%27%3E%3Crect%20width%3D%2713%27%20height%3D%2713%27%20fill%3D%27white%27%2F%3E%3Cpolygon%20points%3D%276.5%2C0.4%208.1%2C4.9%2012.6%2C6.5%208.1%2C8.1%206.5%2C12.6%204.9%2C8.1%200.4%2C6.5%204.9%2C4.9%27%20fill%3D%27black%27%2F%3E%3Ccircle%20cx%3D%276.5%27%20cy%3D%276.5%27%20r%3D%271.3%27%20fill%3D%27white%27%2F%3E%3C%2Fsvg%3E") repeat;background-size:13px 13px;border:1px solid #000}
.hf-in{background:#fff;border:1.5px solid #000;padding:0 5px;overflow:hidden}
.hf-text{direction:rtl;color:#000;-webkit-text-stroke:.35px #000;--ry:calc(var(--L) - 6px)}
.hf-text .ln,.hf-text .hfb{height:var(--L);background-image:linear-gradient(to bottom,transparent calc(var(--ry) - 1.5px),#222 calc(var(--ry) - 1.5px),#222 var(--ry),transparent var(--ry))}
.hf-text .ln{display:flex;direction:rtl;white-space:nowrap}
.hf-text .ln.sb{justify-content:space-between}
.hf-text .ln.st{justify-content:flex-start;gap:.28em}
.hf-text .hw{position:relative;top:var(--dy,0px);display:block;height:var(--L);line-height:var(--L);white-space:nowrap;flex:none}
.hf-text .hfh{display:flex;align-items:flex-end;height:var(--L);padding:0;background:#fff;-webkit-text-stroke:0}
.hf-text .hfh span{display:flex;align-items:center;justify-content:center;width:100%;height:calc(var(--L) - 8px);margin-bottom:4px;box-sizing:border-box;line-height:1;background:#fff;border:1.5px solid #000;outline:1px solid #000;outline-offset:2px;border-radius:4px}
.hf-text .hfb{display:block;line-height:var(--L);text-align:center;-webkit-text-stroke:.2px #000}
.hf-text .num{color:#000;display:inline-block;width:1.5em;height:1.5em;line-height:1.5em;border:1.2px solid #000;border-radius:50%;text-align:center;font-size:.55em;margin:0 .35em;vertical-align:middle;-webkit-text-stroke:0;font-family:Roboto,sans-serif}
.hf-text .ay.focus{background:rgba(255,213,79,.4);box-shadow:0 0 0 .12em rgba(255,213,79,.4);border-radius:0}
.hf-text .hfh{width:100%}

/* splash & loader */
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.splash .big{font-size:56px;color:var(--gold);line-height:1.5}
.splash .orn{width:210px;height:210px;border:3px double var(--gold);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;background:radial-gradient(circle,#10162a 0,#0a0e1c 100%);box-shadow:0 0 0 6px #0a0e1c,0 0 0 8px var(--gold)}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:18px}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{color:var(--sub);line-height:1.6;max-width:320px}

/* menu */
.menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:11px;padding:20px}
.mb{width:min(88%,380px);height:50px;border:0;border-radius:11px;background:var(--btn);color:var(--btnTxt);font-size:21px;font-weight:700;letter-spacing:.2px}
.mb:active{filter:brightness(.85)}
.mb.new{outline:2px solid var(--gold)}

/* lists */
.row{display:flex;align-items:center;margin:7px 8px;padding:10px 12px;background:var(--item);border-radius:4px;min-height:54px;gap:12px}
.row:active{filter:brightness(1.2)}
.row .no{font-size:22px;min-width:34px}
.row .mid{flex:1;min-width:0}
.row .t{font-size:16px}
.row .s{font-size:12px;color:var(--sub);margin-top:2px}
.row .r{font-size:14px;color:var(--sub)}
.row .x{background:none;border:0;color:#ef9a9a;font-size:22px;padding:6px 10px}
.empty{padding:40px 20px;text-align:center;color:var(--sub);line-height:1.7}

/* go to */
.gt{display:grid;grid-template-columns:auto 1fr;gap:22px 8px;align-items:end;padding:0 20px;margin-top:38vh}
.gt label{font-size:24px;color:var(--txt)}
.gt input{background:none;border:0;border-bottom:2px solid var(--txt);color:var(--txt);font-size:24px;height:44px;border-radius:0;outline:0;min-width:0;padding:0 6px}
.gt .gtb{grid-column:1/-1;height:48px;border:0;border-radius:4px;background:var(--btn);color:var(--btnTxt);font-size:24px;font-weight:500;margin-top:2px}
.goto{padding:28px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.goto input,.fld{width:min(88%,380px);height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px;text-align:center;padding:0 12px}

/* reader */
#pg{padding:10px 14px 24px}
.pgtxt{direction:rtl;text-align:justify;line-height:2.15;word-spacing:2px}
.sh{direction:rtl;text-align:center;margin:12px 0 6px;padding:8px;border:1px solid var(--gold);border-radius:8px;background:rgba(212,167,60,.12);display:block}
.sh span{display:block;font-size:1.25em;color:var(--gold)}
.sh small{color:var(--sub);font-size:12px;font-family:Roboto,sans-serif}
.bs{direction:rtl;text-align:center;margin:4px 0 8px;color:var(--txt)}
.ay{border-radius:6px}
.ay.focus{background:rgba(255,213,79,.28)}
.num{color:var(--gold);font-size:.8em;white-space:nowrap}
.ayw{border-bottom:1px solid var(--line);padding:8px 0}
.ayw .ay{display:block;direction:rtl;text-align:right;line-height:2.1}
.trn{font-family:"Noto Sans Bengali",Roboto,sans-serif;font-size:15px;line-height:1.6;color:var(--sub);padding-top:4px}
#foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;background:var(--card);border-top:1px solid var(--line)}
#foot button{background:var(--item);color:var(--txt);border:0;border-radius:8px;height:42px;min-width:64px;font-size:22px}
#foot span{font-size:14px;color:var(--sub);text-align:center}
mark,.hl{background:var(--hl);color:#000;border-radius:3px;padding:0 1px}

/* search */
.sbox{padding:12px;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.sbox .line{display:flex;gap:8px}
.sbox input[type=text]{flex:1;height:48px;font-size:22px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);direction:rtl;text-align:right;min-width:0}
.sbox button.go{height:48px;padding:0 16px;border:0;border-radius:10px;background:var(--gold);color:#111;font-weight:700;font-size:16px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px}
.chip.on{background:var(--bar);border-color:var(--bar);color:#fff}
.sum{padding:10px 14px;font-size:14px;color:var(--sub);line-height:1.5}
.sum b{color:var(--gold)}
.res{margin:8px;padding:10px 12px;background:var(--item);border-radius:8px}
.res .ref{font-size:12px;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.res .ref b{color:var(--gold);font-weight:600}
.res .ayt{direction:rtl;text-align:right;line-height:2.1}
.more{display:block;margin:12px auto 28px;padding:12px 22px;border:0;border-radius:10px;background:var(--bar);color:#fff;font-size:15px}

/* settings */
.set{padding:8px 14px 40px}
.card{background:var(--card);border-radius:10px;padding:14px;margin:12px 0;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--gold)}
.card .prev{direction:rtl;text-align:center;padding:8px 0}
.card input[type=range]{width:100%}
.line2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.btn2{border:0;background:var(--bar);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px}
.btn2.red{background:#8e2b2b}
.small{font-size:12px;color:var(--sub);line-height:1.6}
.sw{position:relative;width:50px;height:28px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:2}
.sw i{position:absolute;inset:0;background:#607d8b;border-radius:14px;transition:.2s}
.sw i:after{content:"";position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}
.sw input:checked+i{background:#43a047}
.sw input:checked+i:after{left:25px}

/* sheet & toast */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:14px 16px 22px;z-index:21;display:none}
#sheet .ttl{text-align:center;color:var(--sub);font-size:13px;margin-bottom:10px}
#sheet button{display:block;width:100%;height:50px;margin:8px 0;border:0;border-radius:10px;background:var(--item);color:var(--txt);font-size:17px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:30;max-width:86%;text-align:center}
</style>

<div id="app">
  <div id="bar" style="display:none"><button id="back" aria-label="Back">&#8592;</button><h1 id="ttl"></h1><span class="sp"></span></div>

</div>
<div id="sheetbg"></div><div id="sheet"></div><div id="toast"></div>

/* Arabic normalisation: drop harakat/marks, unify letter shapes */
const MARKS=/[ؐ-ًؚ-ٰٟۖ-ۭ࣓-ࣿـ​-‏﻿]/g;
function norm(s){return String(s).replace(MARKS,'').replace(/[أإآٱ]/g,'ا').replace(/[ىی]/g,'ي').replace(/ک/g,'ك').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();}
const isWordTok=t=>/[ء-ؿف-يٱ-ۓ]/.test(t);
const hasArabic=s=>/[؀-ۿ]/.test(s);
function stripBism(t){
  const tk=t.split(' ');
  if(tk.length>4 && norm(tk.slice(0,4).join(' '))==='بسم الله الرحمن الرحيم') return tk.slice(4).join(' ');
  return t;
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200);}

/* ================= storage ================= */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('quranapp',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const tmo=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('storage timeout')),ms))]);
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbDel(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

let BM=LS.get('q_bm',[]);

function applyTheme(){document.body.classList.toggle('light',S.theme==='light');}

/* ================= data ================= */
let D=null, PS=[], PE=[], PARASTART=[];
async function fetchEdition(ed){
  let last;
  for(let a=0;a<3;a++){
    try{const r=await fetch(API+ed);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j.data||!j.data.surahs)throw new Error('bad data');return j.data.surahs;}
    catch(e){last=e;await new Promise(r=>setTimeout(r,800*(a+1)));}
  }
  throw last;
}
function buildData(uth,sim){
  const d={v:2,meta:[],ar:[],sm:[],pg:[],jz:[],sn:[],an:[]};
  if(uth.length!==114||sim.length!==114)throw new Error('surah count mismatch');
  for(let i=0;i<114;i++){
    const s=uth[i],ss=sim[i];
    if(s.ayahs.length!==ss.ayahs.length)throw new Error('ayah mismatch '+s.number);
    d.meta.push({n:s.number,ar:s.name,en:s.englishName,tr:s.englishNameTranslation,type:s.revelationType,count:s.ayahs.length,start:d.ar.length});
    for(let k=0;k<s.ayahs.length;k++){
      const a=s.ayahs[k];let t=a.text,m=ss.ayahs[k].text;
      if(s.number!==1&&s.number!==9&&k===0){t=stripBism(t);m=stripBism(m);}
      d.ar.push(t);d.sm.push(m);d.pg.push(a.page);d.jz.push(a.juz);d.sn.push(s.number);d.an.push(a.numberInSurah);
    }
  }
  return d;
}

const SPLIT={p:137,sn:6,an:73,word:'فيكون'}; // page 137 ends inside 6:73, page 138 continues it
const paraOfPage=p=>{let k=1;for(let j=0;j<30;j++)if(PARA_PAGE[j]<=p)k=j+1;return k;};
const paraOfAyah=i=>paraOfPage(D.pg[i]);
function splitWords(i){const w=D.ar[i].split(' ');let k=w.findIndex(x=>norm(x)===SPLIT.word);if(k<0)k=Math.floor(w.length/2);return [w.slice(0,k+1).join(' '),w.slice(k+1).join(' ')];}
function ayParts(i,p){ // text and whether the end-number belongs on this page
  if(D.sn[i]===SPLIT.sn&&D.an[i]===SPLIT.an){const [a,b]=splitWords(i);if(p===SPLIT.p)return {t:a,num:false};if(p===SPLIT.p+1)return {t:b,num:true};}
  return {t:D.ar[i],num:true};
}
function index(){
  D.nm=D.sm.map(norm);
  const n=D.ar.length;
  PS=[];PE=[];PARASTART=[];D.pg=new Array(n);
  PS[1]=0;PE[1]=0;
  for(let p=2;p<=TOTAL_PAGES;p++){
    const [s,a]=PEND[p-2];PE[p]=D.meta[s-1].start+a;
    PS[p]=(p===SPLIT.p+1)?PE[p-1]-1:PE[p-1];
    if(PS[p]<0)PS[p]=0;
    for(let i=PS[p];i<PE[p];i++)if(D.pg[i]===undefined)D.pg[i]=p;
  }
  for(let i=0;i<n;i++)if(D.pg[i]===undefined)D.pg[i]=TOTAL_PAGES;
  for(let k=1;k<=30;k++)PARASTART[k]=PS[PARA_PAGE[k-1]];
  D.maxPage=TOTAL_PAGES;
}
const MANZIL_END=[4,9,16,25,36,49,114];
const manzilOf=sn=>MANZIL_END.findIndex(x=>sn<=x)+1;
function setLoader(html){$('#bar').style.display='none';$('#view').innerHTML=html;}
async function downloadAll(){
  setLoader(`<div class="center"><div class="spin"></div><div class="msg" id="dl">প্রথমবার কোরআনের ডেটা ডাউনলোড হচ্ছে…<br>(ইন্টারনেট দরকার, মাত্র একবার। প্রায় ৪ MB)</div></div>`);
  try{
    $('#dl').firstChild.textContent='কোরআনের মূল টেক্সট (১/২)…';
    const uth=await fetchEdition('quran-uthmani');
    $('#dl').firstChild.textContent='সার্চের জন্য সহজ টেক্সট (২/২)…';
    const sim=await fetchEdition('quran-simple');
    D=buildData(uth,sim);
    try{await tmo(idbSet('quran_v2',D),8000);}catch(e){console.warn('idb save failed',e);}
    index();
  }catch(e){
    setLoader(`<div class="center"><div class="msg">ডেটা ডাউনলোড করা যায়নি।<br>ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।<br><small>${esc(e.message||e)}</small></div><br><button class="mb" id="retry">Retry</button></div>`);
    await new Promise(res=>{$('#retry').onclick=res;});
    return downloadAll();
  }
}
async function loadTranslation(force){
  if(D.tr&&!force)return true;
  if(!force){try{const t=await tmo(idbGet('tr_bn'),4000);if(t&&t.length===D.ar.length){D.tr=t;return true;}}catch(e){}}
  toast('বাংলা অনুবাদ ডাউনলোড হচ্ছে…');
  try{
    const sur=await fetchEdition('bn.bengali');const t=[];
    sur.forEach(s=>s.ayahs.forEach(a=>t.push(a.text)));
    if(t.length!==D.ar.length)throw new Error('translation size mismatch');
    D.tr=t;try{await tmo(idbSet('tr_bn',t),8000);}catch(e){}
    toast('বাংলা অনুবাদ প্রস্তুত');return true;
  }catch(e){toast('অনুবাদ ডাউনলোড ব্যর্থ: '+(e.message||e));return false;}
}

/* ================= router ================= */
const go=(h,replace)=>{if(replace)location.replace(h);else location.hash=h;};
function setBar(title,show=true){$('#bar').style.display=show?'flex':'none';$('#ttl').textContent=title;}
$('#back').onclick=()=>{if(history.length>1)history.back();else location.hash='#/';};
function route(){
  if(!D)return;
  closeSheet();
  const oldf=$('#foot');if(oldf)oldf.remove();$('#view').classList.remove('paper');
  const h=(location.hash||'#/').slice(1);
  const [path,qs]=h.split('?');const q=new URLSearchParams(qs||'');
  const parts=path.split('/').filter(Boolean);
  const v=$('#view');v.scrollTop=0;
  switch(parts[0]){
    case 'surah':return viewSurah();

/* Every printed line is its own fixed-height row, so the ruled lines can never drift away from the text */
function fitHafezi(){
  const v=$('#view'),hf=$('.hf'),inn=$('#hfin'),tx=$('#hft');if(!hf||!inn||!tx||!HFTOK.length)return;
  const availH=v.clientHeight-6-34-4-26;
  const L=Math.max(24,Math.floor((availH-30)/15));
  hf.style.setProperty('--L',L+'px');
  inn.style.height=(L*15)+'px';
  tx.style.lineHeight=L+'px';
  const W=tx.clientWidth;
  // hidden measuring row
  const mz=document.createElement('div');mz.className='ar hf-text';
  mz.style.cssText='position:absolute;visibility:hidden;left:0;top:0;white-space:nowrap;direction:rtl';
  mz.innerHTML=HFTOK.filter(t=>t.k==='w').map(t=>t.h.replace('class="ay hw"','class="ay" style="display:inline-block"')).join(' ');
  inn.appendChild(mz);
  const spans=[...mz.children];
  function build(size){
    mz.style.fontSize=size+'px';
    const gap=size*0.28,out=[];let cur=null,wi=0;
    const flush=()=>{if(cur&&cur.w.length)out.push(cur);cur=null;};
    for(const t of HFTOK){
      if(t.k!=='w'){flush();out.push({sp:t});continue;}
      const w=spans[wi++].offsetWidth;
      if(!cur)cur={w:[],n:0,sum:0};
      const add=w+(cur.w.length?gap:0);
      if(cur.w.length&&cur.sum+add>W){flush();cur={w:[],n:0,sum:0};cur.sum=w;cur.w.push({t,w});continue;}
      cur.sum+=add;cur.w.push({t,w});
    }
    flush();return {out,gap};
  }
  let lo=9,hi=Math.min(L*0.66,56),best=lo;
  for(let k=0;k<12;k++){const mid=(lo+hi)/2;if(build(mid).out.length<=15){best=mid;lo=mid;}else hi=mid;}
  const R=build(best);
  inn.removeChild(mz);
  tx.style.fontSize=best+'px';
  const lines=R.out;
  let html='';
  lines.forEach((ln,idx)=>{
    if(ln.sp){html+=ln.sp.h;return;}
    const nxt=lines[idx+1];const runEnd=!nxt||nxt.sp;
    const short=runEnd&&ln.sum<W*0.6;
    html+=`<div class="ln ${short?'st':'sb'}">${ln.w.map(x=>x.t.h).join('')}</div>`;
  });
  tx.innerHTML=html;
  let ry=L-6;
  try{
    const pb=document.createElement('div');pb.className='ar';
    pb.style.cssText='position:absolute;visibility:hidden;direction:rtl;white-space:nowrap;font-size:'+best+'px;line-height:'+L+'px;left:0;top:0';
    pb.innerHTML='<span>بسم</span><i style="display:inline-block;width:0;height:0"></i>';
    inn.appendChild(pb);
    const base=pb.querySelector('i').getBoundingClientRect().top-pb.getBoundingClientRect().top;
    inn.removeChild(pb);
    if(base>0&&base<2*L){ry=L-4;tx.style.setProperty('--dy',Math.round((L-4-best*0.38)-base)+'px');}
  }catch(e){}
  tx.style.setProperty('--ry',ry+'px');
  const used=lines.length,h0=tx.firstElementChild;
  if(h0&&h0.classList.contains('hfh')&&used<15&&HFTOK.filter(t=>t.k==='h').length===1){h0.style.height=(L*(1+15-used))+'px';h0.style.alignItems='center';}
  const fe=window.__focusEl;if(fe)fe();
}

/* ================= WORD SEARCH ================= */
const SQ={q:'',whole:false,res:[],shown:0,mode:'ar',tokens:0,total:0};
function searchArabic(q,whole){
  const nq=norm(q);if(!nq)return{res:[],total:0};
  const res=[];let total=0;
  for(let i=0;i<D.nm.length;i++){
    const t=D.nm[i];let from=0,pos,hits=[];
    while((pos=t.indexOf(nq,from))!==-1){
      const okL=pos===0||t[pos-1]===' ',okR=pos+nq.length===t.length||t[pos+nq.length]===' ';
      if(!whole||(okL&&okR))hits.push(pos);
      from=pos+nq.length;
    }
    if(hits.length){total+=hits.length;res.push({i,hits,len:nq.length});}
  }
  return{res,total};
}
function searchBengali(q){
  const nq=q.trim().toLowerCase();if(!nq||!D.tr)return{res:[],total:0};
  const res=[];let total=0;
  for(let i=0;i<D.tr.length;i++){
    const t=D.tr[i].toLowerCase();let from=0,pos,hits=[];
    while((pos=t.indexOf(nq,from))!==-1){hits.push(pos);from=pos+nq.length;}
    if(hits.length){total+=hits.length;res.push({i,hits,len:nq.length});}
  }
  return{res,total};
}
/* highlight whole words of the Uthmani text that contain a match */
function hlArabicHTML(r){
  const nm=D.nm[r.i];
  const wset=new Set();
  r.hits.forEach(p=>{
    const a=(nm.slice(0,p).match(/ /g)||[]).length;
    const b=(nm.slice(0,p+r.len-1).match(/ /g)||[]).length;
    for(let w=a;w<=b;w++)wset.add(w);
  });
  const toks=D.ar[r.i].split(' ');
  const nWords=toks.filter(isWordTok).length;
  const nmWords=nm?nm.split(' ').length:0;
  if(nWords!==nmWords){ // fallback: highlight in plain text
    let o='',last=0;
    r.hits.forEach(p=>{o+=esc(nm.slice(last,p))+'<mark>'+esc(nm.slice(p,p+r.len))+'</mark>';last=p+r.len;});
    return o+esc(nm.slice(last));
  }
  let w=0;
  return toks.map(t=>{if(!isWordTok(t))return esc(t);const on=wset.has(w++);return on?`<mark>${esc(t)}</mark>`:esc(t);}).join(' ');
}
function hlTextHTML(text,r){
  let o='',last=0;
  r.hits.forEach(p=>{o+=esc(text.slice(last,p))+'<mark>'+esc(text.slice(p,p+r.len))+'</mark>';last=p+r.len;});
  return o+esc(text.slice(last));
}

function doSearch(){
  const out=$('#sout');if(!out)return;
  const q=SQ.q.trim();
  if(!q){out.innerHTML='<div class="empty">একটি শব্দ লিখুন।</div>';return;}
  let r;
  if(hasArabic(q)){SQ.mode='ar';r=searchArabic(q,SQ.whole);}
  else{
    SQ.mode='bn';
    if(!D.tr){out.innerHTML='<div class="empty">বাংলা শব্দ দিয়ে খুঁজতে হলে Settings থেকে “বাংলা অনুবাদ” চালু করুন।<br>অথবা আরবি শব্দ লিখুন।</div>';return;}
    r=searchBengali(q);
  }
  SQ.res=r.res;SQ.total=r.total;SQ.shown=0;
  if(!r.res.length){out.innerHTML=`<div class="empty">“${esc(q)}” — কোনো আয়াত পাওয়া যায়নি।</div>`;return;}
  out.innerHTML=`<div class="sum">“<b>${esc(q)}</b>” — মোট <b>${r.total}</b> বার, <b>${r.res.length}</b>টি আয়াতে পাওয়া গেছে</div><div id="rl"></div><div id="mr"></div>`;
  showMore();
}
function showMore(){

  let h='';
  for(let k=SQ.shown;k<end;k++){

    h+=`<div class="res" data-i="${r.i}"><div class="ref"><b>${esc(refText(r.i))}</b><span>Page ${D.pg[r.i]} · Para ${paraOfAyah(r.i)}${r.hits.length>1?' · ×'+r.hits.length:''}</span></div><div class="ayt ar" style="font-size:${Math.max(20,S.font-4)}px">${body}</div>${trn}</div>`;

}

  $('#view').innerHTML=`<div class="set">
  <div class="card"><h3>Font size (Simple স্টাইল)</h3><div class="prev ar" id="pv2" style="font-size:${S.font}px">${BISM}</div><input type="range" id="fs" min="20" max="52" value="${S.font}"></div>
  <div class="card"><h3>Reading style</h3><div class="chips" style="margin:0"><span class="chip ${S.style!=='simple'?'on':''}" id="st1">Hafezi (১৫ লাইন, তারা-নকশা)</span><span class="chip ${S.style==='simple'?'on':''}" id="st2">Simple</span></div><div class="small" style="margin-top:8px">Hafezi স্টাইলে লেখার সাইজ নিজে থেকেই পেজে ফিট হয়। অনুবাদ চালু থাকলে পেজ Simple স্টাইলে দেখাবে।</div></div>
  <div class="card"><h3>Theme</h3><div class="line2"><span>Light mode</span><label class="sw"><input type="checkbox" id="th" ${S.theme==='light'?'checked':''}><i></i></label></div></div>
  <div class="card"><h3>বাংলা অনুবাদ</h3><div class="line2"><span>পড়ার পাতা ও সার্চে অনুবাদ দেখান</span><label class="sw"><input type="checkbox" id="tr" ${S.showTr?'checked':''}><i></i></label></div><div class="small">প্রথমবার চালু করলে অনুবাদ ডাউনলোড হবে (ইন্টারনেট লাগবে)। চালু থাকলে বাংলা শব্দ দিয়েও সার্চ করা যায়।</div></div>
  <div class="card"><h3>Data</h3><div class="line2"><span class="small">কোরআনের ডেটা আবার ডাউনলোড করুন</span><button class="btn2" id="rd">Re-download</button></div><div class="line2"><span class="small">সব বুকমার্ক মুছুন (${BM.length}টি)</span><button class="btn2 red" id="cb">Clear</button></div></div>
  <div class="card"><h3>About</h3><div class="small">কোরআনের টেক্সট: Tanzil Project (tanzil.net), AlQuran Cloud API-এর মাধ্যমে। বাংলা অনুবাদ: মুহিউদ্দীন খান। পৃষ্ঠা নম্বর মদিনা মুসহাফ (৬০৪ পৃষ্ঠা) অনুযায়ী।</div></div></div>`;
  $('#fs').oninput=e=>{S.font=+e.target.value;$('#pv2').style.fontSize=S.font+'px';saveS();};
  $('#st1').onclick=()=>{S.style='hafezi';saveS();$('#st1').classList.add('on');$('#st2').classList.remove('on');};
  $('#st2').onclick=()=>{S.style='simple';saveS();$('#st2').classList.add('on');$('#st1').classList.remove('on');};
  $('#th').onchange=e=>{S.theme=e.target.checked?'light':'dark';saveS();applyTheme();};
  $('#tr').onchange=async e=>{
    if(e.target.checked){const ok=await loadTranslation();if(!ok){e.target.checked=false;S.showTr=false;saveS();return;}S.showTr=true;}else S.showTr=false;saveS();};
  $('#cb').onclick=()=>{if(!BM.length)return;if(confirm('সব বুকমার্ক মুছে ফেলবেন?')){BM=[];saveBM();viewSettings();toast('মুছে ফেলা হয়েছে');}};
  $('#rd').onclick=async()=>{if(!confirm('ডেটা আবার ডাউনলোড করবেন? (ইন্টারনেট লাগবে)'))return;
    try{await idbDel('quran_v2');await idbDel('tr_bn');}catch(e){}
    D=null;await downloadAll();if(S.showTr)await loadTranslation(true);location.hash='#/';route();};
}

/* ================= init ================= */
async function init(){
  applyTheme();
  const t0=Date.now();
  $('#view').innerHTML=`<div class="center splash"><div class="orn"><div class="big ar">القرآن<br>الكريم</div></div><div class="spin"></div></div>`;
  try{const d=await tmo(idbGet('quran_v2'),4000);if(d&&d.v===2&&d.ar&&d.ar.length>6000){D=d;index();}}catch(e){console.warn('idb read failed',e);}
  if(D){const w=900-(Date.now()-t0);if(w>0)await new Promise(r=>setTimeout(r,w));}
  else await downloadAll();
  if(S.showTr){const ok=await loadTranslation();if(!ok){S.showTr=false;saveS();}}
  route();
}
window.__ready=init();
</script>
</body>
</html>
